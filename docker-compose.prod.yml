services:
  core:
    image: searxng/searxng:latest
    container_name: searvga_core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    volumes:
      - ./searx:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8889/
    depends_on:
      - tor

  tor:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: searvga_tor
    restart: unless-stopped